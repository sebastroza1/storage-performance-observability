name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: PYTHONPATH=src python -m storage_observatory.benchmark
      - run: PYTHONPATH=src python -m storage_observatory.plot_results
      - run: docker compose config --quiet

